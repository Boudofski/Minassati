<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">منصتي</title>
  <desc id="desc">صورة مشاركة لمنصة تعليمية عربية للأطفال لتعلم أساسيات الإسلام.</desc>
  <defs>
    <linearGradient id="bg" x1="1200" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f766e"/>
      <stop offset="0.48" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="pattern" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M32 4l28 28-28 28L4 32z" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <circle cx="32" cy="32" r="7" fill="rgba(255,255,255,0.12)"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#pattern)" opacity="0.65"/>
  <circle cx="102" cy="92" r="120" fill="#ffffff" opacity="0.11"/>
  <circle cx="1090" cy="548" r="150" fill="#ffffff" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="100" y="96" width="1000" height="438" rx="44" fill="rgba(255,255,255,0.92)"/>
  </g>
  <g direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Cairo, Arial, sans-serif">
    <text x="600" y="222" fill="#0f766e" font-size="42" font-weight="800">منصتي</text>
    <text x="600" y="316" fill="#0f172a" font-size="66" font-weight="900">تعليم إسلامي آمن للأطفال</text>
    <text x="600" y="386" fill="#475569" font-size="34" font-weight="700">دروس مبسطة، أسئلة وأجوبة، وتجربة عربية واضحة</text>
  </g>
  <g transform="translate(470 432)">
